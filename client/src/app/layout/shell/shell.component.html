<mat-sidenav-container class="shell">
  <mat-sidenav #nav class="shell-nav"
    [mode]="(isSmall$ | async) ? 'over' : 'side'"
    [opened]="!(isSmall$ | async)">
    <div class="brand">Warehouse Pulse</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListIcon>dashboard</mat-icon> Dashboard
      </a>
      <a mat-list-item routerLink="/inventory" routerLinkActive="active">
        <mat-icon matListIcon>inventory</mat-icon> Inventory
      </a>
      <a mat-list-item routerLink="/shipments" routerLinkActive="active">
        <mat-icon matListIcon>local_shipping</mat-icon> Shipments
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-icon-button *ngIf="isSmall$ | async" (click)="nav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>{{ title }}</span>
      <span class="toolbar-spacer"></span>
      <button mat-icon-button routerLink="/dashboard" title="Low stock alerts">
        <mat-icon [matBadge]="alertCount$ | async" [matBadgeHidden]="!(alertCount$ | async)" matBadgeColor="warn">notifications</mat-icon>
      </button>
    </mat-toolbar>
    <main class="content">
      <app-low-stock-banner></app-low-stock-banner>
      <ng-content></ng-content>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
