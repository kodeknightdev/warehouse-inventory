<a mat-button routerLink="/shipments"><mat-icon>arrow_back</mat-icon> Shipments</a>

<mat-card>
  <mat-card-title>New shipment</mat-card-title>

  <form [formGroup]="form" (ngSubmit)="save()">
    <mat-radio-group formControlName="direction" class="direction">
      <mat-radio-button value="Outbound">Outbound</mat-radio-button>
      <mat-radio-button value="Inbound">Inbound</mat-radio-button>
    </mat-radio-group>

    <div class="row">
      <mat-form-field class="grow">
        <mat-label>{{ form.value.direction === 'Inbound' ? 'Supplier / from' : 'Customer / ship to' }}</mat-label>
        <textarea matInput formControlName="destination" rows="2"></textarea>
        <mat-error>Required</mat-error>
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field>
        <mat-label>Carrier</mat-label>
        <mat-select formControlName="carrier">
          <mat-option value="">-</mat-option>
          <mat-option *ngFor="let c of carriers" [value]="c">{{ c }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field>
        <mat-label>Tracking #</mat-label>
        <input matInput formControlName="trackingNumber">
      </mat-form-field>

      <mat-form-field>
        <mat-label>Expected date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="expectedAt">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <h3>Lines</h3>
    <div formArrayName="lines">
      <div class="row line" *ngFor="let line of lines.controls; let i = index" [formGroupName]="i">
        <mat-form-field class="grow">
          <mat-label>Item</mat-label>
          <mat-select formControlName="inventoryItemId">
            <mat-option *ngFor="let item of items" [value]="item.id">
              {{ item.sku }} - {{ item.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field class="qty">
          <mat-label>Qty</mat-label>
          <input matInput type="number" formControlName="quantity">
          <mat-hint *ngIf="line.value.inventoryItemId">{{ available(line.value.inventoryItemId) }} on hand</mat-hint>
          <mat-error>At least 1</mat-error>
        </mat-form-field>

        <button mat-icon-button type="button" (click)="removeLine(i)" [disabled]="lines.length === 1">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>

    <button mat-button type="button" (click)="addLine()"><mat-icon>add</mat-icon> Add line</button>

    <div class="actions">
      <button mat-button type="button" routerLink="/shipments">Cancel</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="saving">Create shipment</button>
    </div>
  </form>
</mat-card>
