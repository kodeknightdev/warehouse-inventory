<h2 mat-dialog-title>{{ isNew ? 'New item' : 'Edit ' + item.sku }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content class="grid">
    <mat-form-field>
      <mat-label>SKU</mat-label>
      <input matInput formControlName="sku" autocomplete="off">
      <mat-error *ngIf="form.get('sku').hasError('required')">SKU is required</mat-error>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Category</mat-label>
      <input matInput formControlName="category">
    </mat-form-field>

    <mat-form-field class="wide">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name">
      <mat-error *ngIf="form.get('name').hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field class="wide">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="2"></textarea>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Quantity on hand</mat-label>
      <input matInput type="number" formControlName="quantityOnHand">
      <mat-hint *ngIf="!isNew">Use "Adjust stock" to change</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Reorder level</mat-label>
      <input matInput type="number" formControlName="reorderLevel">
      <mat-hint>0 = no low stock alerts</mat-hint>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Unit</mat-label>
      <mat-select formControlName="unitOfMeasure">
        <mat-option *ngFor="let u of units" [value]="u">{{ u }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Unit cost</mat-label>
      <input matInput type="number" step="0.01" formControlName="unitCost">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Location</mat-label>
      <mat-select formControlName="locationId">
        <mat-option [value]="null">None</mat-option>
        <mat-option *ngFor="let l of locations$ | async" [value]="l.id">{{ l.code }} <small>{{ l.zone }}</small></mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" mat-dialog-close>Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="saving">Save</button>
  </mat-dialog-actions>
</form>
